name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select Terraform Operation'
        required: true
        type: choice
        options:
          - plan-and-apply
          - destroy
        default: plan-and-apply

      lock_id:
        description: 'Stale Terraform Lock ID (optional)'
        required: false
        type: string
        default: ''

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.12.2"
  TF_WORKING_DIR: EKS-Terraform
  BUCKET_NAME: purush-kubernetes-ecommerce

# Prevent simultaneous Terraform operations
concurrency:
  group: terraform-eks
  cancel-in-progress: false

jobs:

  # ============================================================
  # TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Validate & Plan
    if: ${{ inputs.action == 'plan-and-apply' }}
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # AWS AUTHENTICATION
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # TERRAFORM SETUP
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # S3 BACKEND BUCKET
      - name: Create S3 Bucket if not exists
        run: |
          BUCKET_NAME="${{ env.BUCKET_NAME }}"

          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket already exists. Skipping creation."
          else
            echo "Creating S3 bucket..."

            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region "${{ env.AWS_REGION }}"

            echo "Bucket created successfully."
          fi

      - name: Verify S3 Bucket
        run: |
          aws s3api head-bucket \
            --bucket "${{ env.BUCKET_NAME }}"

          echo "S3 bucket is available."

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: EKS-Terraform/tfplan
          retention-days: 5


  # ============================================================
  # TERRAFORM APPLY
  # ============================================================

  terraform-apply:
    name: Terraform Apply
    if: ${{ inputs.action == 'plan-and-apply' }}
    needs: terraform-plan
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # AWS AUTHENTICATION
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # TERRAFORM SETUP
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: EKS-Terraform

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      # TERRAFORM OUTPUTS
      - name: Terraform Outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output


  # ============================================================
  # TERRAFORM DESTROY
  # ============================================================

  terraform-destroy:
    name: Terraform Destroy
    if: ${{ inputs.action == 'destroy' }}
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # AWS AUTHENTICATION
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # TERRAFORM SETUP
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # OPTIONAL STALE LOCK REMOVAL
      - name: Remove Stale Terraform Lock
        if: ${{ inputs.lock_id != '' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          LOCK_ID: ${{ inputs.lock_id }}
        run: terraform force-unlock -force "$LOCK_ID"

      # DESTROY INFRASTRUCTURE
      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve
